project_name: mark2
base_port: 3000
ports_per_task: 10
auto_fix:
  P0: true
  P1: false
  P2: false
phase_defaults:
  design:
    role: expert-system-architect
    cli_tool: claude-code
    model: claude-opus-4-5
    auto_advance: false
  coding:
    role: expert-fullstack-coder
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: false
  testing:
    role: expert-test-engineer
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: false
  code_review:
    role: expert-code-reviewer
    cli_tool: claude-code
    model: claude-opus-4-5
    auto_advance: false
  run_test_plan:
    role: expert-style-reviewer
    cli_tool: claude-code
    model: claude-opus-4-5
    auto_advance: false
  fix_review:
    role: expert-test-engineer
    cli_tool: claude-code
    model: claude-opus-4-5
    auto_advance: false
  final_testing:
    role: expert-e2e-tester
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: false
max_loop_count: 5
server_port: 3100
merge_strategy: squash
