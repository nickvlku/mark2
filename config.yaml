project_name: "mark2"
server_port: 3100
base_port: 3000
ports_per_task: 10
merge_strategy: squash
auto_fix:
  P0: true
  P1: false
  P2: false
max_loop_count: 5
phase_defaults:
  design:
    timeout_minutes: 30
    auto_advance: false
  coding:
    timeout_minutes: 120
    auto_advance: true
  testing:
    timeout_minutes: 60
    auto_advance: true
  code_review:
    timeout_minutes: 30
    auto_advance: true
  run_test_plan:
    timeout_minutes: 15
    auto_advance: false

# State synchronization settings (orphan branch)
state_sync:
  lock_timeout_days: 5        # Days before lock can be force-taken
  auto_pull_on_start: true    # Pull state on mark2 start
