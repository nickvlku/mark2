project_name: mark2
base_port: 3000
ports_per_task: 10
auto_fix:
  P0: true
  P1: false
  P2: false
phase_defaults:
  design:
    role: expert-system-architect
    cli_tool: claude-code
    model: claude-opus-4-6
    auto_advance: false
  coding:
    role: expert-fullstack-coder
    cli_tool: codex-cli
    model: gpt-5.4
    auto_advance: true
  testing:
    role: expert-test-engineer
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: true
  code_review:
    role: expert-code-reviewer
    cli_tool: claude-code
    model: claude-opus-4-6
    auto_advance: true
  fix_review:
    role: expert-fullstack-coder
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: true
  final_testing:
    role: expert-e2e-tester
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: true
  run_test_plan:
    role: expert-qa-analyst
    cli_tool: claude-code
    model: claude-sonnet-4-5
    auto_advance: false
plan_phase_defaults:
  prd:
    role: prd-writer
    cli_tool: claude-code
    model: claude-opus-4-6
    timeout_minutes: 60
    auto_advance: false
  tech_spec:
    role: tech-spec-writer
    cli_tool: claude-code
    model: claude-opus-4-6
    timeout_minutes: 90
    auto_advance: false
  task_generation:
    role: story-planner
    cli_tool: claude-code
    model: claude-sonnet-4-5
    timeout_minutes: 60
    auto_advance: false
max_loop_count: 5
server_port: 3100
merge_strategy: squash
ide_commands:
  - code
  - cursor
  - windsurf
enhance_config:
  role: task-enhancer
  cli_tool: claude-code
  model: claude-sonnet-4-5
  timeout_minutes: 30
