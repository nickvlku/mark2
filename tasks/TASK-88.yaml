id: TASK-88
title: Fix the TMUX tab in the task details side panel
description: The Terminal tab has a very broken view of the Tmux shell running the CLI command.  It isn't live (you have to push refresh), doesn't support colors and doesn't support the TUIs well (they look very broken).  It's basically useless.  Can we make it be a true shell, that we can therotically even interact with?  Research typescript libraries that do this well, I'm sure they exist.
